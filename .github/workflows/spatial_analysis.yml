name: spatial analysis

# ============================================================================
# 空间转录组（Visium）流水线 CI
# ============================================================================
# 设计原则与 geo-normal-pipeline-skill / scrna-pipeline-skill 一致：
#
#   1. **静态检查在前，装依赖在后。** 语法错误 1 秒能发现，
#      不该等 3 分钟装完 scanpy 才知道。
#
#   2. **产物必须上传。** 跑通但拿不到结果是没用的 ——
#      artifact 的 path 清单与脚本写出的文件是两份独立列表，
#      不一致时 job 绿但用户下载后缺文件。用 check_artifact_paths.mjs 兜住。
#
#   3. **空间对齐必须先验证。** 坐标转置/镜像不会报错，散点图看起来
#      "也像组织形状"。verify_spatial_alignment.py 用网格几何判据
#      定量检查（转置会让几何分从 +1.81 翻成 -1.81）。
#
#   4. **图的检查在跑完之后。** 空白图只有真画出来才知道。
#
#   5. 触发路径过滤：改 *.md / references/ 不触发 CI。
#
#   6. **点名工具"装得上"和"跑得了"分开验证。** SpaGCN（§3.2）进主安装路径，
#      因为它真的会跑；cell2location（§3.3）放在 `continue-on-error` 的
#      探测步骤里 —— 装得上就留痕，装不上也不让 job 变红，而流水线产物里
#      记的是"缺参考"（needs_reference）。**"装不上"和"缺数据"是两件事，
#      不能混成一句"没做"。**
# ============================================================================

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/spatial_analysis.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/spatial_analysis.yml"
  workflow_dispatch:
    inputs:
      config:
        description: "配置文件路径"
        required: false
        default: "assets/config.lymph_node.yml"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 自设上限。GitHub 托管 runner 的硬上限是 6 小时；
    # 实测全流程约 3-5 分钟，给 45 分钟留足余量（含装依赖）。
    timeout-minutes: 45

    # 把浮点结果钉死。**这是"设了种子也没用"的那一类随机源** ——
    # 和 UMAP/leiden 那些"没设种子"的不是一回事，只有限制并行度才能消除。
    # 姊妹项目 `geo-normal-pipeline-skill` 的 AGENTS 规则 12 有完整实测记录。
    #
    # 空间这边有两处对末位差异特别敏感：
    #   1. **SpaGCN** 的 GCN 训练（torch CPU）—— 多线程归约顺序会改变
    #      梯度累加，进而改变聚类结果。域划分是**离散**的，末位差异
    #      直接体现为几个 spot 换域，而不是数值上的一点点偏移。
    #   2. **SpatialDE** 的高斯过程拟合与 `eigsh` 迭代。
    # 钉住之后 `spagcn_domains.csv` / `svg_results.csv` 才谈得上可复现。
    env:
      # 1) 线程数：多线程归约的求和顺序取决于线程调度，每次运行都不同。
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      # 2) 内核选择：OpenBLAS 在**运行期**按检测到的 CPU 型号分发 SIMD 内核
      #    （SSE/AVX2/AVX512 向量宽度不同 → 归约顺序不同 → 末位不同）。
      #    这一层线程数管不到；GitHub 托管 runner 的 CPU 型号在同一
      #    Azure 区域内也不单一。钉住内核类型后不再取决于宿主 CPU。
      OPENBLAS_CORETYPE: Haswell
      # 3) Numba 的线程池。**和上面两组是三个独立的旋钮** ——
      #    Numba 的 `prange` 线程数由 `NUMBA_NUM_THREADS` 控制，
      #    不走 OMP/MKL。姊妹项目 scrna 实测：scanpy 默认的近似 kNN
      #    （`pynndescent`）走的就是这条，而它的候选堆更新顺序依赖
      #    线程调度 —— **给了 `random_state` 也不保证逐位可复现**
      #    （scrna AGENTS 规则 20 有完整的三轮 CI 证据）。
      #    空间这边 `sc.pp.neighbors` 同样经过它。
      NUMBA_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          # **用 3.12，不用最新的。** 实测 harmonypy 等包在 3.13/3.14 上
          # 没有 wheel，要从源码编译，且编译时常因缺 numpy 头文件失败。
          python-version: "3.12"

      - name: 静态检查（不装依赖）
        run: |
          node tools/check_py_syntax.mjs
          node tools/check_artifact_paths.mjs
          # 「汇总产物」那段打印逻辑的自检：喂合成 JSON，确认诊断字段
          # （seeded_before_train / adjusted_rand_index / ari_observed_range）
          # **不再被 [:500] 截断掉**。这段逻辑写错了不会有任何报错 ——
          # 只会让日志里少几行，而少了哪几行正是排查时最需要的。
          python tools/selftest_summary_fields.py

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-spatial-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-spatial-${{ runner.os }}-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # **torch 必须先从 CPU 专用索引装。** 默认 PyPI 上的 torch 是 CUDA
          # 构建（2.5 GB+），而 GitHub 托管的 runner 没有 GPU —— 装它纯属
          # 浪费磁盘和时间。requirements.txt 里只声明 `torch>=2.2,<3`，
          # 所以下面 `-r requirements.txt` 看到已满足就不会再装一遍。
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          # **SpaGCN 必须 `--no-deps`。** 它的 install_requires 里有
          # `louvain`，而 louvain 0.8.2 只有到 cp311 的 wheel（py3.12 上要
          # 从 2019 年的 Cython/C++ 源码编译）。但 SpaGCN 的源码里**没有一处**
          # `import louvain` —— 它走 scanpy.tl.louvain，而 init="kmeans"
          # 分支根本不碰它（models.py:52-61）。`--no-deps` 让整条编译链消失。
          # 真实依赖已逐个核对并补进 requirements.txt（见那里的说明）。
          python -m pip install --no-deps SpaGCN==1.2.7
          python -c "import scanpy, anndata, squidpy, torch, SpaGCN; print('核心依赖 OK')"

      - name: 可选工具探测（不阻断）
        # **装不上不能让 job 变红，但"装没装上"必须留痕。**
        # cell2location 是 §3.3 点名的工具，PyPI 有真包 —— 这一步证明
        # "它装得上"，而流水线产物里记的是"缺参考所以没跑"
        # （needs_reference，不是装不上）。两者合起来才是完整的事实。
        #
        # `continue-on-error: true`：依赖链（scvi-tools + pyro-ppl +
        # opencv）哪天断了，红的应该是这条探测，不是整个流水线。
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python -m pip install "cell2location>=0.1.5,<0.2" || \
            echo "cell2location 安装失败 —— 记为装不上，不影响流水线"
          python -c "
          import importlib.util as u
          for m in ['cell2location', 'cell2location.models', 'STAGATE_pyG', 'SpatialDE']:
              print('  OK  ' if u.find_spec(m) else '  --  ', m)
          "

      - name: 显示环境
        run: |
          python -c "
          import importlib
          for m in ['scanpy','anndata','squidpy','skmisc','skimage','leidenalg','igraph','statsmodels','yaml','torch','numba','SpaGCN','SpatialDE','cell2location']:
              try:
                  mod = importlib.import_module(m)
                  print('  OK  ', m, getattr(mod, '__version__', ''))
              except Exception as e:
                  print('  --  ', m, type(e).__name__, e)
          "

      - name: 跑流水线
        run: |
          python scripts/main_analysis.py --config ${{ github.event.inputs.config || 'assets/config.lymph_node.yml' }}

      - name: 验证空间坐标与 H&E 对齐
        # **这一步是对齐检查的独立复核。** 主检查已经在 00_fetch.py 里跑过
        # （因为验收检查要读它的产物 —— 否则那一项会因为文件不存在而
        # **静默跳过**；实测 CI 里 25 项、本地 26 项，差的就是这一项）。
        # 这里用命令行再跑一次：
        #   - 独立进程，不受流水线内存状态影响
        #   - 退出码直接反映结论（坐标不是最佳假设就红）
        #   - 坐标转置不会让任何代码报错，散点图看起来"也像组织形状"
        run: |
          python tools/verify_spatial_alignment.py --config ${{ github.event.inputs.config || 'assets/config.lymph_node.yml' }}

      - name: 检查图不是空白
        run: node tools/check_figures.mjs results/lymph_node/figures

      # 出图名必须与代码阶段对应：`<阶段>-<模块>-<图>-unit<单元>-<名称>`。
      # **图名和脚本序号是两处，而"图名里的模块号写错了"没有任何东西能发现** ——
      # 图照样生成、CI 照样绿、验收照样过，只是读者按图名去 `scripts/` 里找
      # 对应代码时会找错文件。这正是"两处定义必然分叉"那一类。
      - name: 检查出图名与代码阶段对应
        run: node tools/check_fig_names.mjs

      # 图幅（毫米）是否符合栏宽约定（规则 15）。
      # 上一步只看"有没有墨"，看不出图**有多宽** ——
      # 实测规则 15 记的那张 370 mm 的 `domain_markers_dotplot`，
      # 在"有墨迹"这个判据下是完全通过、CI 全绿的。
      # 这里读 PDF 的 /MediaBox 换算成毫米，超出 W_DOUBLE 就红。
      - name: 检查图幅在栏宽以内
        run: node tools/check_fig_sizes.mjs results/lymph_node/figures

      # 分辨率是否达到投稿底线（300 dpi）。
      # **上两步都看不出这个**：150 dpi 的图照样"有墨"、照样在 183 mm 以内，
      # 文件大小也正常 —— 只有放大或印刷时才发现字形发虚。
      # 而它最常见的成因不是画图代码，是**配置把默认值覆盖掉了**：
      # `ana.setdefault("figure_dpi", 300)` 只在键缺失时生效，而
      # `assets/config.lymph_node.yml` 里显式写了这个键。
      # 姊妹项目 scrna 实测踩过：只改了 `common.py`，CI 全绿，
      # artifact 里的 PNG 仍是 907 px（150 dpi）。
      # 判据：dpi = PNG 像素数 / (PDF 的 /MediaBox 点数 / 72)，
      # 物理尺寸从 PDF 读、像素从 PNG 读，两边独立，算出来的是实测值。
      - name: 检查图分辨率达到 300 dpi
        run: node tools/check_fig_dpi.mjs results/lymph_node/figures

      # 调色板：分类循环色够不够、两两分不分得开。
      # **上三步都看不出这个**：类别数超过循环色数时，图照样"有墨"、
      # 照样在 183 mm 以内、照样 300 dpi —— 只是有类别撞色，
      # 而撞色不报错，只让两个不同的东西看起来一样。
      # 判据是算出来的：两两 OKLCh 色相 >=15°、三种色盲下 OKLab 距离
      # >=0.05、白底对比度 >=2.0，外加 PAL_CYCLE 与
      # publication.mplstyle 的 axes.prop_cycle 必须逐色相同。
      - name: 检查调色板
        run: node tools/check_palette.mjs

      - name: 汇总产物
        if: always()
        run: |
          echo "===== results ====="
          find results -type f 2>/dev/null | sort | head -60 || true
          echo "===== data ====="
          find data -type f 2>/dev/null | sort | head -30 || true
          echo "===== 验收结论 ====="
          python -c "
          import json, pathlib
          p = pathlib.Path('results/lymph_node/acceptance_report.json')
          if not p.exists():
              print('（无 acceptance_report.json）'); raise SystemExit
          d = json.loads(p.read_text(encoding='utf-8'))
          print('检查项', d['n_checks'],
                '| required 失败', d['n_required_failed'],
                '| content 失败', d['n_content_failed'],
                '| honesty 失败', d['n_honesty_failed'])
          for c in d['checks']:
              if not c['passed']:
                  print('  [未通过/%s] %s: %s' % (c['severity'], c['id'], c['detail']))
          " 2>/dev/null || cat results/lymph_node/acceptance_report.json 2>/dev/null | head -40 || true
          echo "===== 空间对齐 ====="
          cat data/lymph_node/spatial_alignment_check.json 2>/dev/null | head -30 || true
          echo "===== §3.2 / §3.3 点名工具落地 ====="
          # **跑通了不等于用上了，用上了不等于对。** 这一段把"哪个点名工具
          # 真的产出了结果、哪个没有、为什么"直接打在日志里 ——
          # 否则一个漂亮的域划分结果会让人以为规范点名的三种方法都跑了。
          #
          # **原来这里是 `json.dumps(v)[:500]`，而 `domain_methods` 一长就
          # 从中间被切断** —— 实测排查 SpaGCN 的 ARI 漂移时，最需要的
          # `seeded_before_train` / `seed` 恰好落在第 500 个字符之后，
          # **日志里根本看不到**，只能靠猜。截断的位置不该由"字典有多长"
          # 决定，该由"哪些字段能定位问题"决定。
          #
          # 所以这里改成**按字段名挑**：数值与短标记逐条打全，
          # 长散文（`reason` / `note` / `why_kmeans`）才截断。
          python -c "
          import json, pathlib

          SHORT = ('status', 'used', 'role', 'version', 'n_domains',
                   'length_scale_l', 'n_clusters', 'seed', 'torch_seeded',
                   'seeded_before_train', 'available', 'attempted',
                   'init', 'is_deconvolution', 'compared')
          LONG = ('reason', 'note', 'why_kmeans', 'limitations')

          def show(k, v, ind='    '):
              if isinstance(v, dict):
                  print('%s%s:' % (ind, k))
                  for kk, vv in v.items():
                      show(kk, vv, ind + '  ')
              elif isinstance(v, list):
                  print('%s%s: %s' % (ind, k, json.dumps(v, ensure_ascii=False)[:220]))
              elif k in LONG:
                  print('%s%s: %s' % (ind, k, str(v)[:200]))
              else:
                  print('%s%s: %s' % (ind, k, v))

          for f, keys in (
                  ('results/lymph_node/domain_status.json',
                   ('domain_methods', 'method_agreement', 'reproducibility')),
                  ('results/lymph_node/deconvolution_status.json',
                   ('cell2location',))):
              p = pathlib.Path(f)
              if not p.exists():
                  print(f, '（缺失）'); continue
              print('=====', f)
              d = json.loads(p.read_text(encoding='utf-8'))
              for k in keys:
                  v = d.get(k)
                  if isinstance(v, dict) and k == 'domain_methods':
                      # 只挑诊断用的字段，别把整段散文倒出来
                      v = {t: {kk: vv for kk, vv in (tv or {}).items()
                               if kk in SHORT or kk in LONG}
                           for t, tv in v.items()}
                  print('  %s ->' % k)
                  if isinstance(v, dict):
                      for kk, vv in v.items():
                          show(kk, vv, '    ')
                  else:
                      print('    %s'
                            % json.dumps(v, ensure_ascii=False)[:220])
          " 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-results-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/lymph_node/
            data/lymph_node/domains.h5ad
            data/lymph_node/dataset_info.json
            data/lymph_node/spatial_alignment_check.json

# ----------------------------------------------------------------------------
# **为什么只上传 domains.h5ad。**
#
# 每个 h5ad 都带着完整的 36601 基因矩阵 + layers['counts']，单个 200-320 MB。
# raw / qc_filtered / normalized 是中间态，而 domains.h5ad 是最终态，
# 它**包含**前面所有步骤的信息（raw 全基因集、counts 层、空间域、邻接结构）。
#
# 四个全传约 1 GB，其中约 700 MB 是冗余的。中间态的排除在
# tools/check_artifact_paths.mjs 里以 INTERMEDIATE 白名单**显式声明** ——
# 有意排除，而不是"忘了加进清单"（后者正是那个工具要抓的错误）。
# ----------------------------------------------------------------------------
